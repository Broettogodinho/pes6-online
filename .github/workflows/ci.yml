name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  audit:
    name: Auditoria (sem arquivos do jogo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/audit_game_files.py

  server:
    name: Servidor (pytest)
    runs-on: ubuntu-latest
    needs: audit
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest --cov=tournament --cov-report=term-missing

  patch:
    name: Patch DLL (Win32)
    runs-on: windows-latest
    needs: audit
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S patch -B build/patch -A Win32
      - run: cmake --build build/patch --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: pes6online-dll
          path: build/patch/Release/pes6online.dll
