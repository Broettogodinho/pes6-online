name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  audit:
    name: Auditoria (sem arquivos do jogo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python tools/audit_game_files.py

  server:
    name: Servidor (pytest)
    runs-on: ubuntu-latest
    needs: audit
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest --cov=tournament --cov-report=term-missing

  patch:
    name: Patch DLL (Win32)
    runs-on: windows-latest
    needs: audit
    steps:
      - uses: actions/checkout@v5
      - run: cmake -S patch -B build/patch -A Win32
      - run: cmake --build build/patch --config Release
      - run: ctest --test-dir build/patch -C Release --output-on-failure
      - uses: actions/upload-artifact@v5
        with:
          name: pes6online-dinput8
          path: build/patch/Release/dinput8.dll

  runtime:
    name: Runtime WASM (node --test)
    runs-on: ubuntu-latest
    needs: audit
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: npm test
