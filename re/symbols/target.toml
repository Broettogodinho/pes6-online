entry_point = "0x0077CEE0"   # RVA
size_bytes = 21880832
# Observações (CONFIRMADO por leitura do arquivo; nada foi executado):
# - o executável referencia kitserver/kload.dll (anexado pelo setup.exe do Kitserver):
#   desanexar ou reanexar o Kitserver muda o hash;
# - seções com nomes fora do padrão (age, agis, quod, .rld) -> INFERIDO: executável reempacotado;
# - importa DINPUT8.dll (candidato a DLL proxy dos mods; d3d8.dll/d3d9.dll são do dgVoodoo).
# - importa D3D8.DLL: o jogo usa Direct3D 8 (ver re/notes/imports.md).

